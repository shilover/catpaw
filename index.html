<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no / maximum-scale=1: without these, a fast swipe across
         the fish reads as a pinch or double-tap and zooms the page instead of
         cutting. viewport-fit=cover keeps the canvas under the notch cutouts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2a4a" />
    <meta name="description" content="Tiny Fish — swipe to slice the fish and match the target percentage." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inline so it costs no request and cannot 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a2a4a'/><ellipse cx='18' cy='16' rx='9' ry='6' fill='%23ff7a29'/><path d='M9 16l-5-4v8z' fill='%23ff5a00'/><circle cx='21' cy='14' r='2' fill='%23fff'/></svg>"
    />
    <title>Tiny Fish</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* Swipes are gameplay, not scrolling/zooming gestures. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        line-height: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
