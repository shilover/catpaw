<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no / maximum-scale=1: without these, a fast swipe across
         the fish reads as a pinch or double-tap and zooms the page instead of
         cutting. viewport-fit=cover keeps the canvas under the notch cutouts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2a4a" />
    <meta name="description" content="Tiny Fish — swipe to slice the fish and match the target percentage." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inline so it costs no request and cannot 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a2a4a'/><ellipse cx='18' cy='16' rx='9' ry='6' fill='%23ff7a29'/><path d='M9 16l-5-4v8z' fill='%23ff5a00'/><circle cx='21' cy='14' r='2' fill='%23fff'/></svg>"
    />
    <title>Tiny Fish</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* Swipes are gameplay, not scrolling/zooming gestures. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        line-height: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app canvas {
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
      }

      /* --- boot splash --- */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(#0a2a4a, #1d6fa5);
        z-index: 10;
        transition: opacity 0.35s ease;
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      .boot-fish {
        width: 76px;
        height: 52px;
        background: #ff7a29;
        border-radius: 50% 44% 44% 50%;
        position: relative;
        animation: boot-bob 1.6s ease-in-out infinite;
      }
      .boot-fish::before {
        content: '';
        position: absolute;
        left: -22px; top: 12px;
        border: 14px solid transparent;
        border-right-color: #ff5a00;
      }
      .boot-fish::after {
        content: '';
        position: absolute;
        right: 14px; top: 14px;
        width: 12px; height: 12px;
        border-radius: 50%;
        background: #fff;
      }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50%      { transform: translateY(-10px) rotate(3deg); }
      }
      .boot-title {
        font-family: Arial, sans-serif;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 3px;
        color: #fff;
        text-shadow: 0 2px 0 #0a2a4a;
      }
      .boot-track {
        width: 210px;
        height: 8px;
        border-radius: 4px;
        background: rgba(0, 18, 31, 0.45);
        overflow: hidden;
      }
      .boot-fill {
        width: 0%;
        height: 100%;
        border-radius: 4px;
        background: #8affc1;
        transition: width 0.15s linear;
      }
    </style>
  </head>
  <body>
    <!-- Painted from markup, before a line of JavaScript runs, because the game
         generates all of its art and audio on the fly and that takes real time
         on a phone. Removed by BootScene once generation finishes. -->
    <div id="boot-splash">
      <div class="boot-fish"></div>
      <div class="boot-title">TINY FISH</div>
      <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
